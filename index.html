<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#fff8df">
    <meta name="description" content="世界193か国の国旗を楽しく覚える、子ども向け4択クイズ">
    <title>わくわく！せかいの国旗クイズ</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
  </head>
  <body>
    <main class="app-shell">
      <section id="quiz-screen" class="card" aria-labelledby="app-title">
        <header class="top-bar">
          <div>
            <p class="eyebrow">せかいを たびしよう！</p>
            <h1 id="app-title">こっきクイズ</h1>
          </div>
          <div class="score-pill" aria-label="現在の得点">
            <span aria-hidden="true">⭐</span>
            <strong id="score">0</strong><span>てん</span>
          </div>
        </header>

        <div class="progress-row">
          <p id="question-count">だい 1 もん / 10</p>
          <div class="progress-track" aria-hidden="true">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>

        <div class="flag-stage">
          <p class="question-text">この こっきは どこの くに？</p>
          <div id="flag" class="flag" role="img" aria-label="問題の国旗"></div>
        </div>

        <p id="feedback" class="feedback" aria-live="assertive">えらんでね！</p>
        <div id="answers" class="answers" aria-label="国名の選択肢"></div>
      </section>

      <section id="result-screen" class="card result-card" aria-labelledby="result-title" hidden>
        <div class="celebration" aria-hidden="true">🎉 🌏 🎉</div>
        <p class="eyebrow">10もん おわったよ！</p>
        <h2 id="result-title">けっか はっぴょう</h2>
        <div class="final-score"><strong id="final-score">0</strong><span> / 10 てん</span></div>
        <p id="result-message" class="result-message"></p>
        <button id="restart-button" class="restart-button" type="button">もういちど あそぶ</button>
      </section>
    </main>
  </body>
</html>
